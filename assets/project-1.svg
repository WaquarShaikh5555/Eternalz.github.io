<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Abstract placeholder plate, ink ground with ember accent">
  <!-- Plate 01: ink ground, a technical drawing of an interface, acid tick -->
  <rect width="1200" height="750" fill="#15140F"/>

  <!-- Hairline measuring grid -->
  <g stroke="#EFE9DC" stroke-opacity="0.08" stroke-width="1">
    <path d="M100 0v750M250 0v750M400 0v750M550 0v750M700 0v750M850 0v750M1000 0v750M1150 0v750"/>
    <path d="M0 120h1200M0 270h1200M0 420h1200M0 570h1200M0 690h1200"/>
  </g>

  <!-- Outlined panel -->
  <rect x="140" y="130" width="620" height="480" rx="6" fill="none" stroke="#EFE9DC" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Content bars: ember signal, then bone that fades back -->
  <rect x="200" y="196" width="196" height="14" fill="#F04E23"/>
  <rect x="200" y="250" width="330" height="13" fill="#EFE9DC" fill-opacity="0.6"/>
  <rect x="200" y="302" width="262" height="13" fill="#EFE9DC" fill-opacity="0.34"/>
  <rect x="200" y="354" width="404" height="13" fill="#EFE9DC" fill-opacity="0.18"/>

  <!-- Baseline rule -->
  <path d="M200 512h500" stroke="#EFE9DC" stroke-opacity="0.26" stroke-width="2"/>

  <!-- Detail callout: ember square, bone circle, acid dot -->
  <rect x="880" y="196" width="150" height="150" rx="6" fill="none" stroke="#F04E23" stroke-width="3"/>
  <circle cx="955" cy="271" r="32" fill="none" stroke="#EFE9DC" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="955" cy="271" r="7" fill="#D4F04A"/>
  <path d="M880 366h150" stroke="#EFE9DC" stroke-opacity="0.3" stroke-width="2"/>
</svg>
