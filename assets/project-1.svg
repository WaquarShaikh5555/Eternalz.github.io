<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Abstract placeholder cover graphic">
  <defs>
    <linearGradient id="p1Accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="p1Shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a25"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
    <pattern id="p1Dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#8b93a7" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Base surface -->
  <rect width="1200" height="750" fill="url(#p1Shell)"/>
  <rect width="1200" height="750" fill="url(#p1Dots)" opacity="0.5"/>

  <!-- Offset accent glow -->
  <circle cx="960" cy="140" r="300" fill="url(#p1Accent)" opacity="0.22"/>
  <circle cx="960" cy="140" r="150" fill="url(#p1Accent)" opacity="0.20"/>

  <!-- Layered interface panels -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2">
    <rect x="120" y="150" width="620" height="450" rx="28" fill="#12151d" fill-opacity="0.85"/>
    <rect x="196" y="228" width="468" height="294" rx="20"/>
    <path d="M196 300h468M196 372h468M196 444h468"/>
  </g>

  <!-- Accent bars inside the panel -->
  <g fill="url(#p1Accent)">
    <rect x="228" y="258" width="150" height="14" rx="7"/>
    <rect x="228" y="330" width="230" height="14" rx="7" opacity="0.65"/>
    <rect x="228" y="402" width="110" height="14" rx="7" opacity="0.45"/>
  </g>

  <!-- Foreground pill -->
  <rect x="700" y="520" width="340" height="96" rx="48" fill="#0f1219" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="756" cy="568" r="22" fill="url(#p1Accent)"/>
  <rect x="796" y="558" width="180" height="20" rx="10" fill="#ffffff" fill-opacity="0.18"/>
</svg>
